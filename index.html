<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDG MODA</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo-container">
            <img src="img/logos/logo.png" class="logo">
            <h2>SDG MODA</h2>
            <p>ADMINISTRA TU NEGOCIO, IMPULSA TUS VENTAS</p>
        </div>

        <nav>
            <button onclick="mostrarSeccion('dashboard')">Dashboard</button>
            <button onclick="mostrarSeccion('productos')">Productos</button>
            <button onclick="mostrarSeccion('inventario')">Inventario</button>
            <button onclick="mostrarSeccion('ventas')">Ventas</button>
            <button onclick="mostrarSeccion('clientes')">Clientes</button>
            <button onclick="mostrarSeccion('tiendas')">Tiendas</button>
        </nav>

    </aside>

    <main class="main-content">

        <section id="dashboard" class="section active">
            <h1>Dashboard</h1>

            <div class="dashboard-grid">
                <div class="dashboard-card blue">
                    <h2 id="totalProductos">0</h2>
                    <p>Productos</p>
                </div>

                <div class="dashboard-card green">
                    <h2 id="totalVentas">0</h2>
                    <p>Ventas</p>
                </div>

                <div class="dashboard-card orange">
                    <h2 id="stockBajo">0</h2>
                    <p>Stock Bajo</p>
                </div>

                <div class="dashboard-card red">
                    <h2 id="agotados">0</h2>
                    <p>Agotados</p>
                </div>
            </div>

            <div class="alerts-container">
                <h2>Alertas</h2>
                <div id="alertas"></div>
            </div>
        </section>

        <section id="productos" class="section">

            <h1>Productos</h1>

            <form id="formProducto">

                <input type="text" id="nombreProducto" placeholder="Producto" required>

                <select id="categoriaProducto" required>
                    <option value="">Categoría</option>
                    <option>Jeans</option>
                    <option>Camisas</option>
                    <option>Zapatos</option>
                    <option>Accesorios</option>
                </select>

                <input type="text" id="marcaProducto" placeholder="Marca" required>

                <input type="text" id="colorProducto" placeholder="Color" required>

                <select id="tallaProducto" required>
                    <option value="">Talla</option>
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                </select>

                <input type="number" id="precioProducto" placeholder="Precio" required>
                <input type="number" id="stockProducto" placeholder="Stock" required>
                <input type="number" id="stockMinimo" placeholder="Stock mínimo" required>

                <button type="submit">Guardar</button>

            </form>

            <div id="productosGrid" class="productos-grid"></div>

        </section>

        <section id="inventario" class="section">
            <h1>Inventario</h1>

            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Color</th>
                        <th>Talla</th>
                        <th>Stock</th>
                    </tr>
                </thead>

                <tbody id="tablaInventario"></tbody>
            </table>
        </section>

        <section id="ventas" class="section">
            <h1>Ventas</h1>

            <form id="formVenta">
                <input type="text" id="clienteVenta" placeholder="Cliente" required>
                <input type="text" id="productoVenta" placeholder="Producto" required>
                <input type="number" id="cantidadVenta" placeholder="Cantidad" required>
                <input type="number" id="precioVenta" placeholder="Precio" required>

                <button type="submit">Registrar Venta</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Producto</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody id="tablaVentas"></tbody>
            </table>
        </section>

        <section id="clientes" class="section">
            <h1>Clientes</h1>

            <form id="formCliente">
                <input type="text" id="nombreCliente" placeholder="Nombre" required>
                <input type="text" id="telefonoCliente" placeholder="Teléfono" required>
                <input type="email" id="correoCliente" placeholder="Correo" required>

                <button type="submit">Guardar Cliente</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                    </tr>
                </thead>

                <tbody id="tablaClientes"></tbody>
            </table>
        </section>

        <section id="tiendas" class="section">
            <h1>Tiendas</h1>

            <form id="formTienda">
                <input type="text" id="nombreTienda" placeholder="Nombre tienda" required>
                <input type="text" id="direccionTienda" placeholder="Dirección" required>
                <input type="text" id="telefonoTienda" placeholder="Teléfono" required>

                <button type="submit">Guardar Tienda</button>
            </form>

            <div id="listaTiendas" class="tiendas-grid"></div>

        </section>

    </main>

</div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/productos.js"></script>
<script src="js/inventario.js"></script>
<script src="js/ventas.js"></script>
<script src="js/clientes.js"></script>
<script src="js/tiendas.js"></script>
<script src="js/alerts.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

</body>
</html>
